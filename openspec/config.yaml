schema: spec-driven

context: |
  项目是 Big Apple Live OS，是以 Django 为权威系统、OpenFGA 为运行时授权后端的中文项目。
  所有项目文档和 OpenSpec 规划产物默认使用中文。
  代码、命令、文件路径、API、schema、payload、变量名、类名、函数名、协议名、产品名、
  OpenSpec 结构关键字以及无法准确翻译的专业术语可以保留原文。
  除上述例外外，不得使用英文标题、英文段落或英文任务说明。

rules:
  proposal:
    - 说明性内容必须使用中文；只保留 OpenSpec 结构关键字、代码标识和必要专业术语的原文。
    - 必须明确列出目标、非目标、权限影响、数据影响和公开契约影响。
    - 禁止为具体个人设计专属角色、授权例外或硬编码主体。
  specs:
    - 需求名称、场景名称和说明性内容必须使用中文。
    - 保留 Requirement、Scenario、MUST、SHALL、WHEN、THEN 等 OpenSpec 结构与规范关键字。
    - 每项需求必须包含至少一个可验证场景。
  design:
    - 标题、表格标题、正文、备选方案、风险和迁移说明必须使用中文。
    - 代码、命令、路径、变量名和必要专业术语可以保留原文。
    - 必须解释关键技术选择及未采用方案。
  tasks:
    - 分组标题和任务说明必须使用中文。
    - 每项任务必须保持可由 OpenSpec 解析的复选框与编号格式。
    - 任务必须包含验证标准，不得把未决定的产品问题当作默认假设。

operations:
  apply:
    guidance:
      - 实施过程、进度说明和验证摘要默认使用中文。
      - 代码和技术输出保持项目原有语义标识，不为翻译而修改公开契约或代码标识。
  archive:
    guidance:
      - 归档摘要默认使用中文，并确认主规格不存在不必要的英文说明性内容。
