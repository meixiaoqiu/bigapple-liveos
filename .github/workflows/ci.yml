name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Live OS project check
        run: python scripts/check_project.py
      - name: Django tests
        run: python manage.py test applications core live_os observer simulation simulation_lab workspace worlds --settings=live_os.test_settings

  mysql-concurrency:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dev_big_real
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/dev_big_real?charset=utf8mb4
      BIG_APPLE_REALWORLD_DATABASE_URL: mysql://root:root@127.0.0.1:3306/dev_big_real?charset=utf8mb4
      BIG_APPLE_CONTROL_DATABASE_URL: mysql://root:root@127.0.0.1:3306/dev_big_real?charset=utf8mb4
      BIG_APPLE_AUTHORIZATION_BACKEND: legacy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install Python and MySQL dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config default-libmysqlclient-dev build-essential
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mysql]"
      - name: MySQL authority concurrency tests
        run: >-
          python manage.py test
          core.tests.test_event_feedback.EventFeedbackConcurrencyTests
          core.tests.test_task_funding.TaskFundingConcurrencyTests
          core.tests.test_unified_proposal_services.UnifiedProposalBallotConcurrencyTests
          --settings=live_os.settings_real
          --verbosity=2

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: theme/static_src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: theme/static_src/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend assets
        run: npm run build
